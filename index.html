<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіл-Көмекші | AI для педагогов</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 mt-10 border border-blue-50">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-1">Тіл-Көмекші</h1>
        <p class="text-xs text-gray-400 text-center mb-6 uppercase tracking-widest">Профессиональный помощник</p>

        <div id="chat-box" class="h-96 overflow-y-auto mb-4 p-2 space-y-4 text-sm border-b border-gray-100">
            <div class="bg-blue-50 p-3 rounded-2xl rounded-tl-none border border-blue-100 text-blue-800">
                Салем! Я ваш ИИ-ассистент. Напишите рабочую фразу на русском, и я переведу её на казахский по методике «глагол в конце».
            </div>
        </div>

        <div class="flex gap-2 bg-gray-50 p-2 rounded-xl">
            <input id="user-input" type="text" placeholder="Пример: Студенты, тишина!" 
                   class="flex-1 bg-transparent px-2 py-2 focus:outline-none text-sm">
            <button onclick="sendMessage()" id="send-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-all shadow-md active:scale-95">
                →
            </button>
        </div>
    </div>

    <script type="module">
        const API_URL = "/api/chat"; 

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const btn = document.getElementById('send-btn');
            
            if (!input.value || btn.disabled) return;

            const userMsg = input.value;
            input.value = '';
            btn.disabled = true;

            chatBox.innerHTML += `<div class="flex justify-end"><span class="bg-blue-600 text-white p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[80%]">${userMsg}</span></div>`;
            
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="text-gray-400 text-xs italic">Тіл-Көмекші думает...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMsg })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                const aiText = data.reply;
                
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none shadow-sm text-gray-800 whitespace-pre-line">${aiText}</div>`;
            } catch (e) {
                document.getElementById(loadingId).innerText = "Ошибка: " + e.message;
            } finally {
                btn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        window.sendMessage = sendMessage;
        
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
