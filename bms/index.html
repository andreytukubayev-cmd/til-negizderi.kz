<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг BMS</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Подключаем клиент Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 font-sans antialiased">
    <div class="max-w-md mx-auto space-y-4">
        <h1 class="text-xl font-bold px-2">🔋 BMS Мониторинг</h1>

        <!-- Кнопки выбора периода -->
        <div class="grid grid-cols-4 gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs shadow-inner">
            <button onclick="setPeriod('hour')" id="btn-hour" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Час</button>
            <button onclick="setPeriod('6hours')" id="btn-6hours" class="py-2 rounded-lg bg-slate-800 text-white font-medium transition">6 часов</button>
            <button onclick="setPeriod('day')" id="btn-day" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Сутки</button>
            <button onclick="setPeriod('yesterday')" id="btn-yesterday" class="py-2 rounded-lg text-slate-400 hover:text-white transition">Вчера</button>
        </div>

        <!-- Карточки текущих значений -->
        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
                <div class="text-xs text-slate-400">Напряжение</div>
                <div id="val-v" class="text-2xl font-bold text-green-400 mt-1">--</div>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
                <div class="text-xs text-slate-400">Ток</div>
                <div id="val-c" class="text-2xl font-bold text-yellow-400 mt-1">--</div>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
                <div class="text-xs text-slate-400">Заряд</div>
                <div id="val-s" class="text-2xl font-bold text-blue-400 mt-1">--</div>
            </div>
        </div>

        <!-- Графики с увеличенной высотой -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
            <div class="relative" style="min-height: 280px;"> <!-- Увеличена минимальная высота -->
                <canvas id="voltageChart"></canvas>
            </div>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
            <div class="relative" style="min-height: 280px;"> <!-- Увеличена минимальная высота -->
                <canvas id="currentChart"></canvas>
            </div>
        </div>
        
        <footer class="text-center text-xs text-slate-600 pt-2 pb-4">
            Обновление данных каждые 30 сек.
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://dozirkpilsfxthhzlfiv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lRzYypPaoMrWUgbznU2zKg_T4kW_nkB';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPeriod = '6hours';

        function setPeriod(period) {
            currentPeriod = period;
            ['hour', '6hours', 'day', 'yesterday'].forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (p === period) {
                    btn.className = "py-2 rounded-lg bg-slate-800 text-white font-medium transition";
                } else {
                    btn.className = "py-2 rounded-lg text-slate-400 hover:text-white transition";
                }
            });
            loadData();
        }

        async function loadData() {
            let query = client.from('bms_logs').select('*');
            const now = new Date();

            if (currentPeriod === 'hour') {
                const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
                query = query.gte('created_at', oneHourAgo.toISOString());
            } else if (currentPeriod === '6hours') {
                const sixHoursAgo = new Date(now.getTime() - 6 * 60 * 60 * 1000);
                query = query.gte('created_at', sixHoursAgo.toISOString());
            } else if (currentPeriod === 'day') {
                const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                query = query.gte('created_at', oneDayAgo.toISOString());
            } else if (currentPeriod === 'yesterday') {
                const startYesterday = new Date(now);
                startYesterday.setDate(now.getDate() - 1);
                startYesterday.setHours(0, 0, 0, 0);
                const endYesterday = new Date(now);
                endYesterday.setDate(now.getDate() - 1);
                endYesterday.setHours(23, 59, 59, 999);
                query = query.gte('created_at', startYesterday.toISOString()).lte('created_at', endYesterday.toISOString());
            }

            const { data, error } = await query.order('created_at', { ascending: true });
            if (error || !data || data.length === 0) return;

            const latest = data[data.length - 1];
            document.getElementById('val-v').innerText = latest.voltage.toFixed(2) + ' В';
            document.getElementById('val-c').innerText = latest.current.toFixed(1) + ' А';
            document.getElementById('val-s').innerText = latest.soc + ' %';

            const times = data.map(d => new Date(d.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            
            vChart.data.labels = times;
            vChart.data.datasets[0].data = data.map(d => d.voltage);
            vChart.update();

            cChart.data.labels = times;
            cChart.data.datasets[0].data = data.map(d => d.current);
            cChart.update();
        }

        const chartOptions = { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { 
                legend: { display: false }, // Убрали легенду, т.к. есть подписи
            },
            scales: {
                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
            }
        };

        const vCtx = document.getElementById('voltageChart').getContext('2d');
        const vChart = new Chart(vCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Напряжение', data: [], borderColor: '#4ade80', backgroundColor: 'rgba(74, 222, 128, 0.05)', borderWidth: 2, pointRadius: 2, tension: 0.2 }] },
            options: chartOptions
        });

        const cCtx = document.getElementById('currentChart').getContext('2d');
        const cChart = new Chart(cCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Ток', data: [], borderColor: '#facc15', backgroundColor: 'rgba(250, 204, 21, 0.05)', borderWidth: 2, pointRadius: 2, tension: 0.2 }] },
            options: chartOptions
        });

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
