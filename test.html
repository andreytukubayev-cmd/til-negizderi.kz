<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучение казахского языка - методика Тукубаева А.С.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        
        /* Шапка */
        .chat-header {
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .chat-header h1 {
            font-size: 1.3em;
            color: #333;
        }
        .chat-header p {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        
        /* Область сообщений */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* Сообщения */
        .message {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        /* Индикатор печати */
        .typing-indicator {
            display: inline-block;
            padding: 10px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
        
        /* Поле ввода */
        .input-area {
            background: white;
            padding: 12px 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .input-area button:active {
            transform: scale(0.97);
        }
        
        /* Модальное окно */
        .modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 85%;
        }
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .modal-content button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>🤖 AI-помощник по казахскому языку</h1>
        <p>Методика Тукубаева А.С. — естественное освоение языка</p>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            <div class="message-content">👋 Здравствуйте! Я помогу вам выучить казахский язык.<br><br>Как вас зовут?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off">
        <button id="sendBtn">Отправить</button>
    </div>

    <!-- Модальное окно для имени (скрыто, показывается через JS) -->
    <div id="nameModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>👋 Добро пожаловать!</h2>
            <p>Как мне к вам обращаться?</p>
            <input type="text" id="userName" placeholder="Ваше имя..." autocomplete="off">
            <button id="saveNameBtn">Продолжить</button>
        </div>
    </div>

    <script>
        // ========== ПЕРЕМЕННЫЕ ==========
        let userName = localStorage.getItem('userName') || null;
        let waitingForName = false;
        let totalTranslations = localStorage.getItem('totalTranslations') || 0;
        
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function updateStats() {
            document.getElementById('totalTranslations').textContent = totalTranslations;
        }
        
        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }
        
        function addMessage(text, sender) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="message-content">${text}</div>`;
            container.appendChild(div);
            scrollToBottom();
        }
        
        function showTyping() {
            const container = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.className = 'message bot';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            container.appendChild(indicator);
            scrollToBottom();
        }
        
        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        // ========== ОСНОВНЫЕ ФУНКЦИИ ==========
        function saveName(name) {
            userName = name;
            localStorage.setItem('userName', userName);
            waitingForName = false;
            document.getElementById('nameModal').style.display = 'none';
            addMessage(`👋 Рад познакомиться, ${userName}! Теперь я буду переводить ваши фразы на казахский язык.`, 'bot');
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            let message = input.value.trim();
            if (!message) return;
            
            // Если ждём имя
            if (waitingForName) {
                saveName(message);
                input.value = '';
                return;
            }
            
            addMessage(message, 'user');
            input.value = '';
            showTyping();
            
            // Простая имитация перевода (замените на реальный API)
            setTimeout(() => {
                hideTyping();
                
                // Простой словарь для демонстрации
                const simpleTranslations = {
                    'привет': 'Сәлем',
                    'здравствуйте': 'Сәлеметсіз бе',
                    'как дела': 'Қалыңыз қалай?',
                    'спасибо': 'Рахмет',
                    'пока': 'Сау бол'
                };
                
                let lowerMsg = message.toLowerCase();
                let translation = simpleTranslations[lowerMsg] || `"${message}" - бұл сөздің аудармасы`;
                
                addMessage(`✅ **${translation}**\n\n📖 **Разбор слов:**\n  • ${translation.split(' ')[0]} = перевод\n\n🔊 **Как произнести:** ${translation}`, 'bot');
                
                totalTranslations++;
                localStorage.setItem('totalTranslations', totalTranslations);
                updateStats();
            }, 1000);
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            updateStats();
            
            if (userName) {
                addMessage(`👋 С возвращением, ${userName}! Напишите фразу для перевода на казахский язык.`, 'bot');
            } else {
                waitingForName = true;
                document.getElementById('nameModal').style.display = 'flex';
            }
            
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('userInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            document.getElementById('saveNameBtn').addEventListener('click', () => {
                const name = document.getElementById('userName').value.trim();
                if (name) saveName(name);
            });
        }
        
        init();
    </script>
</body>
</html>
